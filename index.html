<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ourgram</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#000;color:#fff;font-family:sans-serif;padding:10px}#box{height:65vh;overflow:auto;border:1px solid #222;padding:10px;border-radius:12px}input{width:68%;padding:12px;border-radius:25px;border:none;background:#222;color:#fff}button{padding:12px 18px;border-radius:25px;background:#ff0050;color:#fff;border:none;margin-left:5px}</style></head><body><h2>Ourgram 🔥</h2><div id="box">Loading...</div><br><input id="msg" placeholder="kuch likh..."><button onclick="send()">Bhej</button><br><br><input type="file" id="file"><script>const supa = supabase.createClient("https://lupdgnuenlwkacrpndqm.supabase.co","sb_publishable_jb96cnbFDHDaK-2PxJ3BRg_plxW4MRV");async function load(){let {data}=await supa.from('chats').select('*').order('id',{ascending:false}).limit(40);if(!data)return;box.innerHTML=data.reverse().map(m=>`<p style="background:#111;padding:8px;border-radius:10px">${m.msg}</p>`).join('');box.scrollTop=box.scrollHeight}async function send(){let t=msg.value;let f=file.files[0];if(!t&&!f)return;if(f){await supa.storage.from('adda').upload(f.name,f,{upsert:true});let {data}=supa.storage.from('adda').getPublicUrl(f.name);t+=(t?"<br>":"")+`<img src="${data.publicUrl}" style="max-width:100%;border-radius:10px">`}await supa.from('chats').insert([{msg:t}]);msg.value='';file.value='';load()}load();setInterval(load,3000);</script></body></html>
