<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OurGram</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0b141a;color:#fff;height:100vh;display:flex;flex-direction:column}
#lock{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.card{background:#202c33;padding:28px;border-radius:16px;width:100%;max-width:330px;text-align:center}
.card input{width:100%;padding:13px;border-radius:10px;border:none;background:#2a3942;color:#fff;margin-top:14px}
.card button{width:100%;padding:13px;background:#00a884;border:none;border-radius:10px;color:#fff;font-weight:700;margin-top:12px}
.top{background:#202c33;padding:12px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:10}
#msgs{flex:1;overflow:auto;padding:70px 12px 80px 12px}
.bubble{max-width:80%;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:14px}
.me{background:#005c4b;margin-left:auto}
.ot{background:#202c33}
.bar{position:fixed;bottom:0;left:0;right:0;background:#202c33;padding:8px;display:flex;gap:8px}
.bar input{flex:1;padding:12px 16px;border-radius:22px;border:none;background:#2a3942;color:#fff;outline:none}
.bar button{width:44px;height:44px;border-radius:50%;border:none;background:#00a884;color:#fff}
#app{display:none;flex:1;flex-direction:column;height:100vh}
</style>
</head>
<body>
<div id="lock"><div class="card"><h2>🔒 OurGram</h2><p style="color:#8696a0;font-size:13px;margin-top:6px">Secret key daalo</p><input id="pwd" type="password" placeholder="Secret key"><button onclick="unlock()">Unlock</button><p id="err" style="color:#ff5a5a;display:none;margin-top:8px">Galat key!</p></div></div>
<div id="app">
<div class="top"><b>Private Group</b><span style="color:#00a884;font-size:12px"> ● secure</span><input id="uname" placeholder="Naam" style="margin-left:auto;padding:6px 10px;border-radius:8px;border:none;background:#2a3942;color:#fff;width:100px"></div>
<div id="msgs"></div>
<div class="bar"><input id="msgIn" placeholder="Message likho..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
<script>
const SECRET="gram00";
const sb=supabase.createClient("https://lupdgnuelmwkacrpndqm.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1cGRnbnVlbmx3a2FjcnBuZHFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMzIyMDgsImV4cCI6MjEwNDgwODIwOH0.WnnQq5_ZS6ym-tYGFI7EYNHZpEetw0x_8liJvb04tlU");
function unlock(){if(document.getElementById('pwd').value===SECRET){localStorage.setItem('ok','1');document.getElementById('lock').style.display='none';document.getElementById('app').style.display='flex';init();}else{document.getElementById('err').style.display='block';}}
if(localStorage.getItem('ok')==='1'){document.getElementById('lock').style.display='none';document.getElementById('app').style.display='flex';}
async function init(){let {data,error}=await sb.from('chats').select('*').order('created_at',{ascending:true}).limit(300);if(error){alert('DB Error: '+error.message+'\nSupabase me chats table banao');return;}document.getElementById('msgs').innerHTML='';(data||[]).forEach(add);sb.channel('c').on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},p=>add(p.new)).subscribe();}
function add(m){let me=(document.getElementById('uname').value===m.sender);let d=document.createElement('div');d.className='bubble '+(me?'me':'ot');d.innerHTML=`<div style="font-size:11px;color:#25d366">${m.sender}</div>${m.message}<div style="font-size:10px;color:#8696a0;text-align:right;margin-top:2px">${new Date(m.created_at).toLocaleTimeString()} ✓✓</div>`;document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=99999;}
async function send(){let t=document.getElementById('msgIn').value.trim();let s=document.getElementById('uname').value.trim()||'User';if(!t)return;document.getElementById('msgIn').value='';localStorage.setItem('nm',s);let {error}=await sb.from('chats').insert([{sender:s,message:t}]);if(error)alert('Fail: '+error.message);}
document.getElementById('uname').value=localStorage.getItem('nm')||'';if(localStorage.getItem('ok')==='1')init();
</script>
</body>
</html>
