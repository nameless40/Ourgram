<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ourgram</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif;box-sizing:border-box}
body{margin:0;background:#111b21;display:flex;justify-content:center;height:100vh}
.app{width:100%;max-width:480px;background:#0b141a;display:flex;flex-direction:column;position:relative}
.header{background:#202c33;color:#fff;padding:12px 15px;display:flex;align-items:center;gap:12px}
.header b{font-size:19px}
.chat{flex:1;overflow-y:auto;padding:15px 10px;background:#0b141a;background-image:url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');background-repeat:repeat}
.bubble{max-width:78%;padding:8px 10px;border-radius:8px;margin:6px 0;position:relative;word-wrap:break-word;font-size:14.5px;line-height:19px}
.me{background:#005c4b;color:#e9edef;margin-left:auto;border-top-right-radius:0}
.other{background:#202c33;color:#e9edef;margin-right:auto;border-top-left-radius:0}
.meta{font-size:11px;opacity:0.6;text-align:right;margin-top:4px}
.inputbar{background:#202c33;padding:8px;display:flex;align-items:center;gap:8px}
.inputbar input{flex:1;background:#2a3942;border:0;padding:12px 14px;border-radius:22px;color:#fff;outline:none}
.icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2a3942;color:#aebac1;font-size:20px;cursor:pointer;border:0}
.send{background:#00a884;color:#fff}
.emoji-panel{position:absolute;bottom:65px;left:10px;background:#233138;padding:10px;border-radius:12px;display:none;grid-template-columns:repeat(7,1fr);gap:6px;max-width:280px;z-index:10}
.emoji-panel span{font-size:22px;cursor:pointer}
.namebox{position:absolute;inset:0;background:#111b21;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;color:#fff}
.namebox input{padding:12px 15px;border-radius:10px;border:0;width:80%;background:#202c33;color:#fff}
.namebox button{padding:12px 25px;border-radius:20px;border:0;background:#00a884;color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="app">
<div class="header"><b>Ourgram</b><div style="margin-left:auto;opacity:.6;font-size:13px" id="meName"></div></div>
<div class="chat" id="chat"></div>
<div class="emoji-panel" id="emojis"></div>
<div class="inputbar">
<button class="icon" onclick="toggleEmoji()">😊</button>
<button class="icon" onclick="document.getElementById('file').click()">📎</button>
<input type="file" id="file" hidden onchange="sendFile(this)">
<input id="msg" placeholder="Message" onkeydown="if(event.key==='Enter')send()">
<button class="icon send" onclick="send()">➤</button>
</div>
<div class="namebox" id="namebox">
<h3 style="margin:0">Apna naam batao?</h3>
<input id="nameInput" placeholder="Jaise - Ram">
<button onclick="saveName()">Chalo shuru karte hain</button>
</div>
</div>
<script>
const supa=supabase.createClient("https://lupdgnuenlwkacrpndqm.supabase.co","sb_publishable_jb96cnbFDHDaK-2PxJ3BRg_plxW4MRV");
let myName=localStorage.getItem('ourgram_name')||'';
if(myName){document.getElementById('namebox').style.display='none';document.getElementById('meName').innerText=myName}
function saveName(){let v=document.getElementById('nameInput').value.trim();if(!v)return;myName=v;localStorage.setItem('ourgram_name',v);document.getElementById('namebox').style.display='none';document.getElementById('meName').innerText=v;load()}
const em=["😊","😂","❤️","🔥","👍","🙏","😍","🥺","😭","😎","🤩","😅","🫡","👏","💀","✨","🌸","💯","😇","🤝"];let ep=document.getElementById('emojis');em.forEach(e=>{let s=document.createElement('span');s.innerText=e;s.onclick=()=>{document.getElementById('msg').value+=e;ep.style.display='none'};ep.appendChild(s)});
function toggleEmoji(){ep.style.display=ep.style.display==='grid'?'none':'grid'}
async function load(){let{data}=await supa.from('chats').select('*').order('id',{ascending:true});let c=document.getElementById('chat');c.innerHTML='';data.forEach(m=>{let isMe=m.sender===myName;let d=document.createElement('div');d.className='bubble '+(isMe?'me':'other');let content='';if(m.type==='image')content=`<img src="${m.file_url}" style="max-width:200px;border-radius:8px"><br>${m.msg}`;else if(m.type==='file')content=`<a href="${m.file_url}" target="_blank" style="color:#53bdeb">📄 File dekho</a><br>${m.msg}`;else content=m.msg.replace(/</g,'&lt;');d.innerHTML=`<div style="font-size:12px;font-weight:600;color:${isMe?'#53bdeb':'#00a884'};margin-bottom:2px">${m.sender||'Anon'}</div>${content}<div class="meta">${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ✓✓</div>`;c.appendChild(d)});c.scrollTop=c.scrollHeight}
async function send(){let i=document.getElementById('msg');let t=i.value.trim();if(!t)return;i.value='';await supa.from('chats').insert({msg:t,sender:myName||'Anon',type:'text'});load()}
async function sendFile(inp){let f=inp.files[0];if(!f)return;let name=Date.now()+'_'+f.name;let{error}=await supa.storage.from('files').upload(name,f);if(error){alert('Upload fail: '+error.message);return}let{data}=supa.storage.from('files').getPublicUrl(name);let type=f.type.startsWith('image')?'image':'file';await supa.from('chats').insert({msg:f.name,sender:myName,file_url:data.publicUrl,type:type});load()}
supa.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'chats'},load).subscribe();load();
</script>
</body>
</html>
